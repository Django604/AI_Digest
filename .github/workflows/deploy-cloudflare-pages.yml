name: Deploy Dashboard To Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - "docs/**"
      - "config/dashboard_targets.json"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "data/source/NEV+ICE_xsai.xlsm"
      - "data/source/NEV+ICE_ldai.xlsm"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build dashboard data
        run: python scripts/build_dashboard.py --workbook data/source/NEV+ICE_xsai.xlsm --arrival-workbook data/source/NEV+ICE_ldai.xlsm --out docs/data/dashboard.json --preserve-input-modified-times

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=django604-ai-digest --branch=main --commit-dirty=true
